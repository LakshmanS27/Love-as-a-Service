name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger deployment on main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Built-in token for authentication
          publish_dir: ./                            # Root folder
          publish_branch: gh-pages                  # Correct input for target branch
          user_name: github-actions
          user_email: github-actions@github.com
          force_orphan: true                        # Optional, clean branch each deploy
