<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LaaS - Onboarding Quiz</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f23665",
              "background-light": "#f8f6f6",
              "background-dark": "#221015",
              "accent": "#FF6B6B",
              "outline": "#000000",
              "fill": "#F0F0F0"
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark text-outline dark:text-background-light group/design-root overflow-x-hidden">
<header class="flex flex-col items-center justify-center p-6 pt-8">
<h2 class="text-xl font-bold tracking-tight">Compiling your profile...</h2>
</header>
<main class="flex-grow px-4 pb-28">
<!-- Progress Bar -->
<div class="flex flex-col gap-2 p-2">
<div class="flex items-center gap-2">
<div class="flex-grow h-1 rounded-full bg-outline/10">
<div class="h-1 rounded-full bg-accent" style="width: 20%;"></div>
</div>
<span class="text-sm font-medium">1 / 5</span>
</div>
</div>
<!-- Quiz Card 1 -->
<div class="mt-6 flex flex-col rounded-lg border border-outline bg-background-light dark:bg-background-dark">
<div class="flex items-center justify-center border-b border-outline p-4">
<span class="material-symbols-outlined text-outline dark:text-background-light" data-icon="light_mode"></span>
<div class="mx-4 h-6 w-px bg-outline"></div>
<span class="material-symbols-outlined text-outline dark:text-background-light" data-icon="dark_mode"></span>
</div>
<div class="p-6">
<h1 class="text-lg font-bold leading-tight text-center">Light Mode or Dark Mode?</h1>
<p class="mt-2 text-center text-sm text-outline/70 dark:text-background-light/70">A true personality indicator.</p>
<div class="mt-6 flex flex-col gap-3">
<label class="flex h-12 cursor-pointer items-center justify-center rounded-lg border border-outline px-4 text-sm font-medium has-[:checked]:border-accent has-[:checked]:bg-fill has-[:checked]:text-outline">
<input class="sr-only" name="theme-choice" type="radio" value="light"/>
<span>Light. My future is bright.</span>
</label>
<label class="flex h-12 cursor-pointer items-center justify-center rounded-lg border border-outline px-4 text-sm font-medium has-[:checked]:border-accent has-[:checked]:bg-fill has-[:checked]:text-outline">
<input checked="" class="sr-only" name="theme-choice" type="radio" value="dark"/>
<span>Dark. Like my coffee.</span>
</label>
</div>
</div>
</div>
<!-- Quiz Card 2 (example of another card) -->
<div class="mt-6 flex flex-col rounded-lg border border-outline bg-background-light dark:bg-background-dark opacity-50">
<div class="flex items-center justify-center border-b border-outline p-4">
<span class="material-symbols-outlined text-outline dark:text-background-light" data-icon="commit"></span>
<div class="mx-4 h-6 w-px bg-outline"></div>
<span class="material-symbols-outlined text-outline dark:text-background-light" data-icon="favorite"></span>
</div>
<div class="p-6">
<h1 class="text-lg font-bold leading-tight text-center">Describe your ideal commit message:</h1>
<p class="mt-2 text-center text-sm text-outline/70 dark:text-background-light/70">It says a lot about you.</p>
<div class="mt-6 flex flex-col gap-3">
<label class="flex h-12 cursor-pointer items-center justify-center rounded-lg border border-outline px-4 text-sm font-medium">
<input class="sr-only" disabled="" name="commit-choice" type="radio" value="poetic"/>
<span>Poetic &amp; Detailed</span>
</label>
<label class="flex h-12 cursor-pointer items-center justify-center rounded-lg border border-outline px-4 text-sm font-medium">
<input class="sr-only" disabled="" name="commit-choice" type="radio" value="short"/>
<span>Short &amp; Sweet</span>
</label>
</div>
</div>
</div>
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-0 left-0 right-0 z-10 bg-gradient-to-t from-background-light to-transparent dark:from-background-dark p-4 pb-6">
<button class="flex h-14 w-full items-center justify-center gap-2 rounded-lg border-2 border-outline bg-background-light dark:bg-background-dark text-base font-bold text-outline dark:text-background-light shadow-[4px_4px_0px_0px_#000000] dark:shadow-[4px_4px_0px_0px_#f8f6f6] active:shadow-none active:translate-x-1 active:translate-y-1 transition-all">
<span>Next</span>
<span class="material-symbols-outlined text-outline dark:text-background-light" data-icon="arrow_forward"></span>
</button>
</div>
</div>
</body></html>
