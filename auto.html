<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flirt Formatter</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer base {
          .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
          }
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f23665",
              "background-light": "#f8f6f6",
              "background-dark": "#221015",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-800/50">
<div class="relative flex min-h-screen w-full flex-col justify-end bg-transparent font-display group/design-root overflow-x-hidden">
<!-- Modal Container -->
<div class="flex h-auto w-full flex-col bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 rounded-t-xl border-t border-gray-200 dark:border-gray-700">
<!-- BottomSheetHandle -->
<div class="flex h-5 w-full items-center justify-center pt-3">
<div class="h-1 w-9 rounded-full bg-gray-300 dark:bg-gray-600"></div>
</div>
<div class="p-4 sm:p-6 flex flex-col gap-6">
<!-- Header Section -->
<header class="flex flex-col items-start text-left">
<h1 class="text-gray-900 dark:text-white font-bold text-3xl leading-tight font-display tracking-tight">// Rewrite Flirt &lt;3</h1>
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal mt-1">Our AI will help you debug your romance.</p>
</header>
<!-- Text Input Field -->
<div class="flex flex-col">
<label class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2" for="message-input">Input: string</label>
<textarea class="form-input w-full resize-none rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:border-primary focus:ring-primary min-h-36 p-4 text-base font-normal leading-normal" id="message-input" placeholder="Enter your draft message here..."></textarea>
</div>
<!-- Preview Section -->
<div class="flex flex-col">
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-tight pb-2">Formatted Preview</h3>
<div class="relative flex min-h-36 w-full items-center justify-center rounded-lg border border-dashed border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 p-4">
<p class="text-center text-gray-500 dark:text-gray-400">Your enhanced message will appear here...</p>
<!-- Example of generated message (can be hidden/shown)
                        <div class="absolute inset-0 flex flex-col justify-between p-4">
                            <p class="text-gray-900 dark:text-white">Are you a 'finally' block? Because you always execute, no matter what exceptions I throw.</p>
                            <button class="self-end text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors">
                                <span class="material-symbols-outlined text-2xl">content_copy</span>
                            </button>
                        </div>
                        -->
</div>
</div>
<!-- Primary Action Button -->
<div class="flex flex-col items-stretch pt-4">
<button class="flex h-12 items-center justify-center gap-2 rounded-lg bg-primary px-6 text-base font-bold text-white shadow-sm transition-all hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                        Format Flirt
                        <!-- Loading dots example
                        <span class="flex gap-1">
                            <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-white delay-0"></span>
                            <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-white delay-150"></span>
                            <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-white delay-300"></span>
                        </span>
                        -->
</button>
</div>
</div>
</div>
</div>
</body></html>
